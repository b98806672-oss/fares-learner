    <script>
      // Gracefully ignore expected Vite WebSocket HMR disconnects in cloud preview environments
      window.addEventListener('error', function (e) {
        if (
          e &&
          e.message &&
          (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('closed without opened') !== -1)
        ) {
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        if (
          e &&
          e.reason &&
          e.reason.message &&
          (e.reason.message.indexOf('WebSocket') !== -1 || e.reason.message.indexOf('closed without opened') !== -1)
        ) {
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
